name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Check the files are in the right place
        run: |
          if [ ! -f package.json ] || [ ! -d android ] || [ ! -d www ]; then
            echo "::error::package.json, android and www must be at the top level of the repository, not inside another folder."
            ls -la
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Find Android SDK
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK" ] && [ -d "$SDK" ]; then
            echo "Android SDK found at $SDK"
            echo "sdk.dir=$SDK" > android/local.properties
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Android SDK not on this machine, installing it."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK (only if missing)
        if: steps.sdk.outputs.found != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci || npm install

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. Building a debug APK instead."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || true
          PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          AL="$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')"
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias "$AL" > /dev/null 2>&1; then
            echo "Signing key is OK."
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$AL" >> "$GITHUB_ENV"
          else
            echo "::warning::The signing secrets don't match (KEYSTORE_BASE64, KEYSTORE_PASSWORD or KEY_ALIAS was pasted wrongly). Building a debug APK instead."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ] && ./gradlew assembleRelease --no-daemon; then
            cp app/build/outputs/apk/release/app-release.apk ../MeritCalculator.apk
            echo "Built a signed release APK."
          else
            if [ -n "$KEYSTORE_FILE" ]; then echo "::warning::Signed build failed, building a debug APK instead."; fi
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../MeritCalculator.apk
            echo "Built a debug APK."
          fi

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Merit Calculator 1.0.${{ github.run_number }}
          body: Download MeritCalculator.apk below and open it on your Android phone to install.
          files: MeritCalculator.apk
          make_latest: true
